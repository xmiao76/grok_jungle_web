[package]
name = "jungle-engine"
version = "1.2.0"
edition = "2021"
description = "Native Jungle (Dou Shou Qi) engine — WASM + native"
license = "MIT"

[lib]
name = "jungle_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "jungle-engine"
path = "src/bin/jungle-engine.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1.1"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
